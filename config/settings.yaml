# RiskLens settings — change values here, not in code.

paths:
  raw_dir: data/raw/home-credit-default-risk
  duckdb_file: data/processed/risklens.duckdb
  reports_dir: reports

economics:
  net_margin: 0.08          # earned on a good loan, after funding cost
  lgd: 0.60                 # share of loan lost when a customer defaults
  min_approval_rate: 0.70   # business constraint

baseline_rules:
  ext_source_2_min: 0.30
  credit_income_ratio_max: 5.0

kaggle:
  credit_competition: home-credit-default-risk
  fraud_competition: ieee-fraud-detection
scorecard:
  random_seed: 42             # same seed = same split every time
  split: [0.6, 0.2, 0.2]      # train, valid, test
  max_bins: 10                # numeric features: up to 10 equal-sized bins
  min_bin_share: 0.05         # categories smaller than 5% go into "Other"
  min_iv: 0.02                # drop features weaker than this ("useless")
  max_corr: 0.6               # drop a feature if it repeats a stronger one this much
  max_features: 15            # a scorecard stays small enough to explain
  max_pvalue: 0.05            # a coefficient must be statistically significant
  base_score: 600             # this score means...
  base_odds: 50               # ...odds of 50 goods to 1 bad
  pdo: 20                     # points to double the odds